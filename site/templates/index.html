{% extends "base.html" %}
{% block main %}
<section class="hero">
  <h1>Think in outlines.<br>Stay in the terminal.</h1>
  <p class="pitch">tpt is a keyboard-driven infinite outliner that keeps everything in one plain TaskPaper file you own.</p>
  <div class="install">
    <code id="install">{{ config.extra.install }}</code>
    <button type="button" class="copy" data-copy="install">Copy</button>
  </div>
  <p class="links"><a class="button" href="{{ get_url(path='@/tutorial/_index.md') }}">Read the Tutorial</a> <a href="{{ config.extra.github | safe }}">View on GitHub</a></p>
  <img class="shot" src="{{ get_url(path='screenshots/outline.png') }}" width="1070" height="691"
       alt="tpt showing an outline of projects, sections and tasks with date chips, stars, flags and colored rows">
</section>
{% endblock %}
{% block scripts %}<script src="{{ get_url(path='js/site.js', cachebust=true) }}" defer></script>{% endblock %}
