[package]
name = "taskpaper-terminal"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "tpt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
jiff = "0.2.37"
ratatui = "0.30.2"
signal-hook = "0.3.18"
slotmap = "1.1.1"
tempfile = "3.27.0"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
cognitive_complexity = "warn"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
termlens = "0.11.4"
