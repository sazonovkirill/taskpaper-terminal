[package]
name = "taskpaper-terminal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
