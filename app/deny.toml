# Dependency policy from docs/quality/code-quality.md (Toolchain and dependencies).

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    # nucleo-matcher, the fuzzy matcher architecture.md §3 names.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "hashbrown@0.16.1", reason = "kasuari, under ratatui-core 0.1, still uses hashbrown 0.16" },
    { crate = "windows-sys@0.60.2", reason = "notify 8 and file-id, under notify-debouncer-full 0.7, still use windows-sys 0.60" },
    { crate = "syn@2.0.119", reason = "derive_more (crossterm) and strum_macros (ratatui) still use syn 2" },
    { crate = "compact_str@0.9.1", reason = "ratatui-core 0.1 still uses compact_str 0.9; tachyonfx 0.25 uses 0.10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
